<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#130b31">
  <title>Chiana Arena</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@500;700;800;900&display=swap');
    :root{--ink:#130b31;--panel:#f8f5ff;--violet:#7650e9;--purple:#4f2ba4;--pink:#f33f87;--mint:#22d8ae;--yellow:#ffd04d;--muted:#766f91}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--ink);font-family:Nunito,system-ui,sans-serif;background:radial-gradient(circle at 12% 4%,#5d39b1 0 4%,transparent 22%),radial-gradient(circle at 90% 90%,#fa8db9 0 2%,transparent 23%),linear-gradient(135deg,#160a38,#32146d 52%,#1a0d45);}
    body:before,body:after{content:"";position:fixed;pointer-events:none;z-index:-1;border-radius:50%;opacity:.32}body:before{width:280px;height:280px;left:-130px;bottom:10%;background:var(--mint);filter:blur(45px)}body:after{width:300px;height:300px;right:-120px;top:22%;background:var(--pink);filter:blur(52px)}
    button,textarea,input{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.65} [hidden]{display:none!important}
    #hud{position:sticky;top:0;z-index:3;min-height:68px;padding:10px max(18px,calc((100vw - 1100px)/2));display:flex;gap:11px;align-items:center;background:#120a30e8;border-bottom:2px solid #ffffff24;backdrop-filter:blur(12px);color:#fff}.logo{font:400 clamp(1.2rem,3vw,1.65rem) 'Bowlby One',sans-serif;letter-spacing:.5px;color:var(--yellow);text-shadow:2px 3px #3b1d80;margin-right:auto}.pill{border:2px solid #ffffff50;border-radius:999px;padding:6px 10px;font-weight:900;white-space:nowrap}.xp{height:13px;width:clamp(85px,18vw,210px);background:#ffffff2a;border:2px solid #ffffff80;border-radius:999px;overflow:hidden}.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--yellow));transition:width .5s}.sound{border:0;border-radius:10px;background:#ffffff18;color:#fff;font-size:1.05rem;padding:8px 10px}
    main{width:min(920px,calc(100% - 28px));margin:38px auto 60px}.hero{text-align:center;color:#fff;margin:12px auto 28px}.hero h1{font:400 clamp(2.4rem,8vw,5rem)/.94 'Bowlby One',sans-serif;color:var(--yellow);text-shadow:4px 5px 0 var(--purple),0 0 30px #ffdb62;letter-spacing:1px;margin:8px 0}.hero p{margin:16px auto 0;max-width:510px;font-weight:800;font-size:1.12rem}.robot{width:105px;height:105px;margin:auto;position:relative;animation:bob 2.2s ease-in-out infinite}.robot .head{position:absolute;inset:15px 7px 37px;border:4px solid var(--ink);border-radius:28px;background:#cfc6ff;box-shadow:inset 0 -7px #a79aea}.robot .head:before{content:"";position:absolute;left:26px;top:-19px;width:34px;height:18px;border:4px solid var(--ink);border-bottom:0;border-radius:18px 18px 0 0}.robot .screen{position:absolute;inset:10px;border-radius:15px;background:var(--ink)}.robot .screen:before,.robot .screen:after{content:"";position:absolute;top:12px;width:12px;height:12px;border-radius:50%;background:var(--mint);box-shadow:0 0 9px var(--mint)}.robot .screen:before{left:15px}.robot .screen:after{right:15px}.robot .body{position:absolute;left:21px;right:21px;bottom:2px;height:36px;border:4px solid var(--ink);border-radius:14px 14px 20px 20px;background:var(--violet)}.robot .body:after{content:"✦";color:var(--yellow);font-size:20px;position:absolute;left:25px;top:2px}.robot.mad .screen:before,.robot.mad .screen:after{background:var(--pink);box-shadow:0 0 8px var(--pink)}.robot.happy{animation:jump .45s ease-in-out infinite alternate}
    .card{background:var(--panel);border:4px solid var(--ink);border-radius:23px;padding:clamp(18px,4vw,32px);box-shadow:9px 10px 0 #130b31b8}.card h2{font:400 1.55rem 'Bowlby One',sans-serif;margin:0 0 9px;color:var(--purple)}label{display:block;font-weight:900;margin:18px 0 8px}textarea{resize:vertical;width:100%;min-height:190px;border:3px solid var(--ink);border-radius:14px;padding:14px;background:#fff;color:var(--ink);font-weight:700;line-height:1.45;outline:none}textarea:focus{border-color:var(--violet);box-shadow:0 0 0 4px #7650e940}.drop{border:3px dashed var(--purple);border-radius:14px;margin:0;padding:13px 16px;background:#eeeaff;display:flex;gap:7px;align-items:center;justify-content:space-between;flex-wrap:wrap;cursor:pointer;color:var(--purple)}.drop.over{border-color:var(--pink);background:#ffe5ef}.drop span{font-size:.86rem;color:var(--muted)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px}.btn{border:3px solid var(--ink);border-radius:13px;background:var(--yellow);color:var(--ink);font-weight:900;padding:12px 17px;box-shadow:4px 5px 0 var(--ink);transition:transform .1s,box-shadow .1s}.btn:active{transform:translate(3px,4px);box-shadow:1px 1px 0 var(--ink)}.btn.primary{background:var(--pink);color:#fff}.btn.ghost{background:#fff}.hint{margin:15px 0 0;color:var(--muted);font-size:.9rem;font-weight:800}.status{margin-top:16px;border-radius:12px;font-weight:900;padding:11px 13px;display:none}.status.ok{display:block;background:#d9fff5;border:2px solid #159c7d;color:#086851}.status.error{display:block;background:#ffe0ed;border:2px solid #d02669;color:#8d1240}.status.loading{display:block;background:#eeeaff;border:2px solid var(--violet);color:var(--purple)}
    .round{display:flex;align-items:center;gap:14px;margin:0 0 15px;color:#fff;font-weight:900;font-size:1.12rem}.health{height:20px;flex:1;overflow:hidden;border:3px solid #fff;border-radius:999px;background:#ffffff28}.health i{display:block;width:100%;height:100%;background:linear-gradient(90deg,var(--pink),var(--yellow));transition:width .45s}.question{display:grid;grid-template-columns:112px 1fr;gap:14px;align-items:center}.bubble{position:relative;background:#fff;border:4px solid var(--ink);border-radius:19px 19px 19px 4px;padding:20px;min-height:98px;font-size:1.18rem;font-weight:900;line-height:1.43;box-shadow:7px 8px 0 #130b3199}.bubble:before{content:"";position:absolute;left:-16px;bottom:16px;border-width:12px 16px 12px 0;border-style:solid;border-color:transparent var(--ink) transparent transparent}.bubble:after{content:"";position:absolute;left:-9px;bottom:19px;border-width:9px 12px 9px 0;border-style:solid;border-color:transparent #fff transparent transparent}.answer{margin-top:22px}.answer textarea{min-height:126px}.feedback{margin-top:22px;display:grid;grid-template-columns:126px 1fr;gap:18px;align-items:center}.grade{border:4px solid var(--ink);border-radius:20px;background:var(--yellow);box-shadow:5px 6px var(--ink);font:400 3.7rem 'Bowlby One',sans-serif;text-align:center;padding:6px 4px}.grade.good{background:var(--mint)}.grade.bad{background:var(--pink);color:#fff}.feedback h2{margin:0 0 5px}.feedback p{margin:0;line-height:1.5;font-weight:800}.final{text-align:center}.final .grade{display:inline-block;padding:5px 25px;margin:15px}.stars{font-size:2.4rem;letter-spacing:4px;color:var(--yellow);text-shadow:1px 2px var(--purple)}.weak{text-align:left;background:#eeeaff;border-radius:14px;padding:14px 20px;margin:16px 0;font-weight:800}.weak li{margin:7px 0}.small{font-size:.87rem;color:var(--muted);font-weight:800}#confetti{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}.confetti{position:absolute;width:11px;height:17px;animation:fall 1.8s linear forwards}
    @keyframes bob{50%{transform:translateY(-8px) rotate(1deg)}}@keyframes jump{to{transform:translateY(-14px) rotate(-3deg)}}@keyframes fall{to{transform:translate(var(--x),110vh) rotate(720deg);opacity:0}}@media(max-width:600px){#hud{gap:7px}.pill:nth-of-type(2){display:none}.question{grid-template-columns:1fr}.question .robot{margin-left:0}.bubble:before,.bubble:after{display:none}.feedback{grid-template-columns:1fr}.grade{width:130px}.hero h1{font-size:2.8rem}main{margin-top:26px}}
  </style>
</head>
<body>
  <header id="hud">
    <span class="logo">Chiana Arena</span>
    <span class="pill" id="level">Lv 1</span>
    <div class="xp" title="Esperienza"><i id="xpbar"></i></div>
    <span class="pill" id="xp">0 XP</span>
    <button class="sound" id="sound" aria-label="Attiva/disattiva audio" title="Audio">🔊</button>
  </header>

  <main>
    <section id="setup">
      <div class="hero">
        <div class="robot"><i class="head"><i class="screen"></i></i><i class="body"></i></div>
        <h1>Chiana Arena</h1>
        <p>Carica gli appunti. Rispondi. Sali di livello.</p>
      </div>
      <div class="card">
        <h2>Allenamento di oggi</h2>
        <label class="drop" id="drop" for="file">📚 Carica appunti <span id="fileName">.txt o .md — oppure trascinali qui</span></label>
        <input id="file" type="file" accept=".txt,.md,text/plain,text/markdown" hidden>
        <label for="notes">Oppure incolla il testo</label>
        <textarea id="notes" placeholder="Incolla qui gli appunti da studiare…"></textarea>
        <div class="row">
          <button class="btn primary" id="start">Entra nell'arena</button>
          <button class="btn ghost" id="test">Prova connessione</button>
        </div>
        <p class="hint">Chiana usa il server locale: le chiavi delle API non vengono mai inviate al browser.</p>
        <div class="status" id="status" role="alert"></div>
      </div>
    </section>

    <section id="quiz" hidden>
      <div class="round"><span id="round">Round 1</span><div class="health" title="Domande rimanenti"><i id="health"></i></div></div>
      <div class="question">
        <div class="robot" id="quizBot"><i class="head"><i class="screen"></i></i><i class="body"></i></div>
        <div class="bubble" id="question" aria-live="polite"></div>
      </div>
      <div class="card answer" id="answerCard">
        <label for="answer">La tua risposta</label>
        <textarea id="answer" placeholder="Scrivi la risposta qui. Ctrl/Cmd + Invio per inviare."></textarea>
        <div class="row"><button class="btn primary" id="send">Rispondi</button></div>
      </div>
      <div class="card feedback" id="feedback" hidden>
        <div class="grade" id="grade">0</div>
        <div><h2 id="verdict">Chiana valuta…</h2><p id="feedbackText"></p><div class="row"><button class="btn primary" id="continue">Continua</button></div></div>
      </div>
    </section>

    <section id="final" class="card final" hidden>
      <div class="robot happy"><i class="head"><i class="screen"></i></i><i class="body"></i></div>
      <h2>Chiana è stato sconfitto!</h2>
      <div class="stars" id="stars">★★★</div>
      <p class="small">Voto complessivo</p><div class="grade" id="finalGrade">0</div>
      <p id="summary"></p>
      <div class="weak"><strong>Da ripassare</strong><ul id="weaknesses"></ul></div>
      <button class="btn primary" id="again">Nuova partita</button>
    </section>
  </main>
  <div id="confetti"></div>

  <script>
    // Chiana Arena API configuration
const queryApi = new URLSearchParams(location.search).get('api');

const NGROK_SERVER_URL = 'https://blightingly-in-golly.ngrok-free.app';

// Use localhost when running through server.py.
// Use ngrok when opened as a file or hosted online.
const isLocalServer =
  location.protocol !== 'file:' &&
  ['localhost', '127.0.0.1'].includes(location.hostname);

const API_BASE = queryApi
  ? queryApi.replace(/\/$/, '')
  : isLocalServer
    ? location.origin
    : NGROK_SERVER_URL;

const TUNNEL_HEADERS = API_BASE.includes('.ngrok-free.app')
  ? {'ngrok-skip-browser-warning': 'true'}
  : {};    const $ = selector => document.querySelector(selector);
    const state = { history: [], question: '', total: 6, passed: 0, xp: 0, level: 1, muted: false, result: null };
    const QUIZ_SYSTEM = `Sei Chiana, un robot-professore severo ma costruttivo. Parla sempre in italiano, al maschile, e dai del tu.
Devi interrogare lo studente ESCLUSIVAMENTE sul materiale fornito. Fai una sola domanda per volta. Valuta una risposta da 0 a 10; se è sotto 9, chiedi di rispondere di nuovo alla stessa domanda, riformulata. Quando supera 9, passa alla domanda successiva. Fai al massimo 6 domande significative.
Rispondi SEMPRE e SOLO con JSON valido, senza markdown: {"total":number,"question":string,"feedback":string,"grade":number|null,"passed":boolean,"completed":boolean,"final_grade":number|null,"weaknesses":string[],"summary":string}. Alla prima domanda grade deve essere null e feedback una stringa vuota. completed è true solo dopo l'ultima risposta superata.`;

    function url(path){ return API_BASE + path; }
    function setStatus(text, kind='loading'){ const e=$('#status'); e.textContent=text; e.className='status '+kind; }
    function clearStatus(){ $('#status').className='status'; $('#status').textContent=''; }
    function setBusy(b, label){ $('#start').disabled=b; $('#send').disabled=b; $('#test').disabled=b; if(b) setStatus(label || 'Chiana sta pensando…', 'loading'); else clearStatus(); }
    function sound(freq=600){ if(state.muted)return; try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;g.gain.value=.045;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.15);o.stop(c.currentTime+.15)}catch(_){} }
    function updateHud(){ const needed=180, level=Math.floor(state.xp/needed)+1; if(level>state.level){state.level=level; burst(70);sound(880)} $('#level').textContent='Lv '+state.level; $('#xp').textContent=state.xp+' XP'; $('#xpbar').style.width=((state.xp%needed)/needed*100)+'%'; }
    function burst(n=110){ const box=$('#confetti'), colors=['#ffd04d','#f33f87','#22d8ae','#cfc6ff','#fff']; for(let i=0;i<n;i++){const p=document.createElement('i');p.className='confetti';p.style.left=(5+Math.random()*90)+'vw';p.style.top=(-20-Math.random()*24)+'px';p.style.background=colors[i%colors.length];p.style.setProperty('--x',(-180+Math.random()*360)+'px');p.style.animationDelay=(Math.random()*.28)+'s';box.append(p);setTimeout(()=>p.remove(),2400)} }
    function stripJson(text){ return text.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,''); }
    function normalise(raw){ let value; try{value=JSON.parse(stripJson(raw));}catch(_){throw new Error('Chiana ha inviato una risposta non valida. Riprova.')} if(!value || typeof value.question!=='string') throw new Error('La risposta di Chiana è incompleta. Riprova.'); return { total:Math.max(1,Math.min(6,Math.round(Number(value.total)||state.total))), question:value.question, feedback:String(value.feedback||''), grade:value.grade===null?null:Math.max(0,Math.min(10,Number(value.grade)||0)), passed:Boolean(value.passed), completed:Boolean(value.completed), final_grade:value.final_grade===null?null:Math.max(0,Math.min(10,Number(value.final_grade)||0)), weaknesses:Array.isArray(value.weaknesses)?value.weaknesses.map(String).slice(0,8):[], summary:String(value.summary||'') }; }
    async function ask(messages){ const response=await fetch(url('/api/chat'),{method:'POST',headers:{'Content-Type':'application/json',...TUNNEL_HEADERS},body:JSON.stringify({messages,max_tokens:1000,temperature:.35})}); const body=await response.json().catch(()=>({})); if(!response.ok) throw new Error(body.error || 'Il server non ha risposto correttamente.'); if(!body.text) throw new Error('Il server ha ricevuto una risposta vuota.'); return body.text; }
    function setView(name){ ['setup','quiz','final'].forEach(id=>$('#'+id).hidden=id!==name); scrollTo({top:0,behavior:'smooth'}); }
    function renderQuestion(question){ state.question=question; $('#question').textContent=question; $('#answer').value=''; $('#answerCard').hidden=false; $('#feedback').hidden=true; $('#round').textContent='Round '+Math.min(state.passed+1,state.total)+' di '+state.total; $('#health').style.width=Math.max(0,100-state.passed/state.total*100)+'%'; $('#quizBot').className='robot'; $('#answer').focus(); }
    function showFeedback(result){ state.result=result; const grade=result.grade ?? 0, passed=result.passed || grade>=9; const gain=Math.round(grade*10*(passed?1.2:1)); state.xp+=gain; if(passed)state.passed++; const tile=$('#grade'); tile.textContent=grade.toFixed(grade%1?1:0); tile.className='grade '+(passed?'good':grade<6?'bad':''); $('#verdict').textContent=passed?'Colpo andato a segno!':grade>=6?'Ci sei quasi — riprova!':'Rimettiamo a fuoco.'; $('#feedbackText').textContent=result.feedback || 'Rispondi di nuovo in modo più completo.'; $('#continue').textContent=result.completed?'Vedi il risultato finale':passed?'Prossimo round':'Riprova la domanda'; $('#answerCard').hidden=true; $('#feedback').hidden=false; $('#quizBot').className='robot '+(passed?'happy':'mad'); if(passed){burst();sound(820)}else sound(220); updateHud(); }
    function end(result){ const score=result.final_grade ?? (state.passed ? 9 : 0); $('#finalGrade').textContent=score.toFixed(score%1?1:0); $('#finalGrade').className='grade '+(score>=9?'good':score<6?'bad':''); $('#stars').textContent='★'.repeat(score>=9?3:score>=7?2:1)+'☆'.repeat(score>=9?0:score>=7?1:2); $('#summary').textContent=result.summary || 'Allenamento completato.'; const list=$('#weaknesses'); list.innerHTML=''; (result.weaknesses.length?result.weaknesses:['Rivedi gli argomenti in cui hai esitato.']).forEach(x=>{const li=document.createElement('li');li.textContent=x;list.append(li)}); setView('final'); burst(180);sound(1040); }
    async function start(){ const notes=$('#notes').value.trim(); if(!notes){setStatus('Incolla o carica degli appunti prima di iniziare.', 'error');return} state.history=[{role:'system',content:QUIZ_SYSTEM},{role:'user',content:'MATERIALE DI STUDIO:\n---\n'+notes+'\n---\nInizia ora con la prima domanda.'}]; state.passed=0; state.total=6; state.result=null; setBusy(true,'Chiana sta leggendo gli appunti…'); try{const raw=await ask(state.history);state.history.push({role:'assistant',content:raw});const result=normalise(raw);state.total=result.total;setView('quiz');renderQuestion(result.question);sound(660)}catch(error){setStatus(error.message,'error')}finally{setBusy(false)} }
    async function submit(){ const answer=$('#answer').value.trim(); if(!answer){setStatus('Scrivi una risposta prima di inviarla.', 'error');return} state.history.push({role:'user',content:'La mia risposta: '+answer}); setBusy(true,'Chiana sta correggendo…'); try{const raw=await ask(state.history);state.history.push({role:'assistant',content:raw});showFeedback(normalise(raw))}catch(error){state.history.pop();setStatus(error.message,'error')}finally{setBusy(false)} }
    async function test(){ setBusy(true,'Controllo il server…'); try{const response=await fetch(url('/api/health'),{headers:TUNNEL_HEADERS});const data=await response.json(); if(!response.ok)throw new Error(data.error||'Server non disponibile.'); if(!data.ready)throw new Error('Il server funziona, ma non trova alcuna chiave/provider configurato.'); setStatus('✅ Server pronto — provider disponibili: '+data.available_providers.join(', '),'ok');sound(880)}catch(error){setStatus(error.message,'error')}finally{$('#start').disabled=false;$('#send').disabled=false;$('#test').disabled=false} }
    $('#start').onclick=start;$('#send').onclick=submit;$('#test').onclick=test;$('#continue').onclick=()=>{const r=state.result;if(r.completed)return end(r);renderQuestion(r.question)};$('#again').onclick=()=>{state.history=[];state.passed=0;state.result=null;setView('setup')};$('#answer').onkeydown=e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))submit()};$('#sound').onclick=()=>{state.muted=!state.muted;$('#sound').textContent=state.muted?'🔇':'🔊'};
    const file=$('#file'),drop=$('#drop'); function loadFile(f){if(!f)return; if(f.size>500000){setStatus('Il file è troppo grande: usa al massimo 500 KB di testo.', 'error');return}const reader=new FileReader();reader.onload=()=>{$('#notes').value=String(reader.result||'');$('#fileName').textContent='✓ '+f.name};reader.readAsText(f)} file.onchange=e=>loadFile(e.target.files[0]);['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over')}));['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over')}));drop.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));
    updateHud();
  </script>
</body>
</html>
