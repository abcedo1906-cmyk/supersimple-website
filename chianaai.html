<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ChianaAI</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #06060a;
  --s1:       #0d0d14;
  --s2:       #13131e;
  --border:   rgba(255,255,255,0.07);
  --c1:       #ff6b35;
  --c2:       #ff2d78;
  --c3:       #bd00ff;
  --c4:       #00d4ff;
  --text:     #f0f0ff;
  --muted:    #4a4a6a;
  --success:  #00ffaa;
  --error:    #ff4466;
  --r:        16px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 16px 60px;
  overflow-x: hidden;
}

/* ── Animated gradient orbs ── */
.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  opacity: 0.18;
  pointer-events: none;
  z-index: 0;
  animation: drift 14s ease-in-out infinite alternate;
}
.orb1 { width: 500px; height: 500px; background: var(--c1); top: -200px; left: -150px; animation-delay: 0s; }
.orb2 { width: 400px; height: 400px; background: var(--c3); bottom: -100px; right: -100px; animation-delay: -5s; }
.orb3 { width: 300px; height: 300px; background: var(--c4); top: 40%; left: 50%; transform: translateX(-50%); animation-delay: -10s; }

@keyframes drift {
  from { transform: translate(0, 0) scale(1); }
  to   { transform: translate(30px, 40px) scale(1.1); }
}

/* ── Hero ── */
.hero {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 60px 0 32px;
  width: 100%;
  max-width: 600px;
}

.hero-badge {
  display: inline-block;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--c1);
  border: 1px solid rgba(255,107,53,0.35);
  border-radius: 99px;
  padding: 4px 14px;
  margin-bottom: 18px;
  animation: fadeUp 0.6s ease both;
}

.hero h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(4rem, 18vw, 7rem);
  letter-spacing: 0.02em;
  line-height: 0.9;
  background: linear-gradient(135deg, var(--c1) 0%, var(--c2) 40%, var(--c3) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: fadeUp 0.6s 0.1s ease both;
}

.hero-sub {
  font-size: 0.78rem;
  color: var(--muted);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-top: 10px;
  animation: fadeUp 0.6s 0.2s ease both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Card ── */
.card {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 600px;
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 24px;
  animation: fadeUp 0.5s 0.3s ease both;
  transition: border-color 0.3s;
}

.card:hover { border-color: rgba(255,255,255,0.12); }

.card + .card { margin-top: 14px; }

/* ── Drop zone ── */
#dropzone {
  position: relative;
  border: 2px dashed rgba(255,255,255,0.1);
  border-radius: var(--r);
  padding: 40px 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.25s;
  overflow: hidden;
}

#dropzone::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, rgba(255,107,53,0.06) 0%, transparent 70%);
  opacity: 0;
  transition: opacity 0.3s;
}

#dropzone:hover::before,
#dropzone.drag-over::before { opacity: 1; }

#dropzone:hover,
#dropzone.drag-over {
  border-color: var(--c1);
  background: rgba(255,107,53,0.04);
}

#dropzone.has-file {
  border-color: var(--success);
  border-style: solid;
}

#dropzone input[type="file"] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
  width: 100%;
  height: 100%;
}

.dz-icon {
  font-size: 2.5rem;
  margin-bottom: 10px;
  display: block;
  transition: transform 0.3s;
}

#dropzone:hover .dz-icon { transform: scale(1.15) rotate(-5deg); }

.dz-title {
  font-weight: 700;
  font-size: 1rem;
  color: var(--text);
}

.dz-sub {
  font-size: 0.7rem;
  color: var(--muted);
  margin-top: 6px;
  letter-spacing: 0.05em;
}

#file-name {
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--success);
  margin-top: 14px;
  min-height: 20px;
  text-align: center;
  word-break: break-all;
  transition: all 0.3s;
}

/* ── Progress ── */
#progress-wrap {
  display: none;
  flex-direction: column;
  gap: 10px;
}
#progress-wrap.visible { display: flex; }

.progress-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.progress-label-text {
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--c1);
}

#progress-label {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.4rem;
  letter-spacing: 0.05em;
  background: linear-gradient(90deg, var(--c1), var(--c2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

#progress-bar-track {
  width: 100%;
  height: 8px;
  background: var(--s2);
  border-radius: 99px;
  overflow: hidden;
  position: relative;
}

#progress-bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--c1), var(--c2), var(--c3));
  background-size: 200% 100%;
  border-radius: 99px;
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  animation: shimmer 2s linear infinite;
  position: relative;
}

#progress-bar-fill::after {
  content: '';
  position: absolute;
  right: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 0 8px var(--c2), 0 0 16px var(--c2);
}

@keyframes shimmer {
  from { background-position: 200% center; }
  to   { background-position: -200% center; }
}

/* ── Transcribe button ── */
.btn-wrap {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 600px;
  margin-top: 14px;
  animation: fadeUp 0.5s 0.4s ease both;
}

#transcribe-btn {
  width: 100%;
  padding: 18px;
  background: linear-gradient(135deg, var(--c1), var(--c2), var(--c3));
  background-size: 200% 200%;
  border: none;
  border-radius: var(--r);
  color: #fff;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.5rem;
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.3s, opacity 0.2s;
  animation: gradshift 4s ease infinite;
  box-shadow: 0 4px 30px rgba(255,45,120,0.3);
}

#transcribe-btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 8px 40px rgba(255,45,120,0.5);
}

#transcribe-btn:active:not(:disabled) {
  transform: scale(0.98);
}

#transcribe-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
  box-shadow: none;
  animation: none;
  background: var(--muted);
}

@keyframes gradshift {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ── Status ── */
#status {
  position: relative;
  z-index: 1;
  font-size: 0.75rem;
  font-weight: 500;
  text-align: center;
  min-height: 20px;
  color: var(--muted);
  letter-spacing: 0.06em;
  margin-top: 8px;
  transition: color 0.3s;
}
#status.error   { color: var(--error); }
#status.success {
  color: var(--success);
  text-shadow: 0 0 20px rgba(0,255,170,0.4);
}

/* ── Result ── */
#result-wrap {
  display: none;
  animation: resultReveal 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
}
#result-wrap.visible { display: block; }

@keyframes resultReveal {
  from { opacity: 0; transform: translateY(30px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

#result-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}

.result-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.2rem;
  letter-spacing: 0.08em;
  background: linear-gradient(90deg, var(--success), var(--c4));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

#result-meta {
  font-size: 0.65rem;
  color: var(--muted);
  margin-top: 2px;
  letter-spacing: 0.08em;
}

#copy-btn {
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.72rem;
  font-weight: 600;
  padding: 6px 16px;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.04em;
}
#copy-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.15); }
#copy-btn.copied {
  color: var(--success);
  border-color: var(--success);
  background: rgba(0,255,170,0.08);
}

#result-text {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  font-size: 0.9rem;
  line-height: 1.75;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 360px;
  overflow-y: auto;
  color: var(--text);
  user-select: text;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

#result-text::-webkit-scrollbar { width: 4px; }
#result-text::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

/* ── Confetti particle ── */
.confetti {
  position: fixed;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  pointer-events: none;
  z-index: 9999;
  animation: confettiFall 1.2s ease-in forwards;
}

@keyframes confettiFall {
  0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* ── Pulse ring on success ── */
.pulse-ring {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9998;
  animation: pulseOut 0.6s ease-out forwards;
  border: 3px solid var(--success);
  border-radius: 0;
}

@keyframes pulseOut {
  from { opacity: 0.4; transform: scale(0.95); }
  to   { opacity: 0; transform: scale(1.05); }
}

/* ── Waveform animation during transcription ── */
.wave-wrap {
  display: none;
  justify-content: center;
  align-items: flex-end;
  gap: 4px;
  height: 32px;
  margin-top: 4px;
}
.wave-wrap.visible { display: flex; }

.wave-bar {
  width: 4px;
  border-radius: 2px;
  background: linear-gradient(to top, var(--c2), var(--c3));
  animation: waveBounce 1s ease-in-out infinite;
}

.wave-bar:nth-child(1) { animation-delay: 0.0s; }
.wave-bar:nth-child(2) { animation-delay: 0.1s; }
.wave-bar:nth-child(3) { animation-delay: 0.2s; }
.wave-bar:nth-child(4) { animation-delay: 0.3s; }
.wave-bar:nth-child(5) { animation-delay: 0.2s; }
.wave-bar:nth-child(6) { animation-delay: 0.1s; }
.wave-bar:nth-child(7) { animation-delay: 0.0s; }

@keyframes waveBounce {
  0%, 100% { height: 4px; opacity: 0.4; }
  50%       { height: 28px; opacity: 1; }
}
</style>
</head>
<body>

<!-- Background orbs -->
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<!-- Hidden config -->
<input type="hidden" id="server-url" value="https://blightingly-in-golly.ngrok-free.app">
<input type="hidden" id="api-token" value="zVtdyYyxAbDZJ4DfY_-OC4aeZk9MxeWyhpoEkvIwq6M">

<!-- Hero -->
<header class="hero">
  <div class="hero-badge">✦ Powered by Whisper large-v3</div>
  <h1>ChianaAI</h1>
  <p class="hero-sub">local transcription · zero cloud · pure speed</p>
</header>

<!-- Drop zone -->
<div class="card">
  <div id="dropzone">
    <input type="file" id="file-input" accept="audio/*,video/*">
    <span class="dz-icon">🎙️</span>
    <div class="dz-title">Drop your audio here</div>
    <div class="dz-sub">mp3 · wav · m4a · flac · ogg · mp4 · opus · and more</div>
  </div>
  <div id="file-name"></div>
</div>

<!-- Progress -->
<div class="card" id="progress-wrap">
  <div class="progress-header">
    <span class="progress-label-text">Transcribing</span>
    <span id="progress-label">0%</span>
  </div>
  <div id="progress-bar-track">
    <div id="progress-bar-fill"></div>
  </div>
  <div class="wave-wrap visible" id="wave">
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
    <div class="wave-bar"></div>
  </div>
</div>

<!-- Button -->
<div class="btn-wrap">
  <button id="transcribe-btn" disabled>Transcribe</button>
</div>

<!-- Status -->
<div id="status"></div>

<!-- Result -->
<div class="card" id="result-wrap" style="margin-top:14px;">
  <div id="result-header">
    <div>
      <div class="result-title">Transcript</div>
      <div id="result-meta"></div>
    </div>
    <button id="copy-btn">Copy ↗</button>
  </div>
  <div id="result-text"></div>
</div>

<script>
  let selectedFile = null;

  const urlInput      = document.getElementById('server-url');
  const tokenInput    = document.getElementById('api-token');
  const fileInput     = document.getElementById('file-input');
  const dropzone      = document.getElementById('dropzone');
  const fileNameEl    = document.getElementById('file-name');
  const transcribeBtn = document.getElementById('transcribe-btn');
  const progressWrap  = document.getElementById('progress-wrap');
  const wave          = document.getElementById('wave');

  // ── File picker ────────────────────────────────────────────────────────────
  fileInput.addEventListener('change', () => {
    if (fileInput.files.length > 0) _setFile(fileInput.files[0]);
  });

  dropzone.addEventListener('dragover',  e => { e.preventDefault(); dropzone.classList.add('drag-over'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('drag-over');
    if (e.dataTransfer.files.length > 0) _setFile(e.dataTransfer.files[0]);
  });

  function _setFile(file) {
    selectedFile = file;
    fileNameEl.textContent = `📎 ${file.name}  (${(file.size/1024/1024).toFixed(2)} MB)`;
    transcribeBtn.disabled = false;
    dropzone.classList.add('has-file');
    document.querySelector('.dz-icon').textContent = '✅';
    _setStatus('');
  }

  // ── Transcribe ─────────────────────────────────────────────────────────────
  transcribeBtn.addEventListener('click', async () => {
    const serverUrl = urlInput.value.trim().replace(/\/$/, '');
    const token     = tokenInput.value.trim();

    if (!serverUrl || !token || !selectedFile) return;

    _setBusy(true);
    _setProgress(0);
    _setStatus('Uploading…');
    document.getElementById('result-wrap').classList.remove('visible');

    const formData = new FormData();
    formData.append('file', selectedFile, selectedFile.name);

    try {
      const response = await fetch(
        `${serverUrl}/transcribe?token=${encodeURIComponent(token)}`,
        { method: 'POST', body: formData }
      );

      if (response.status === 401) { _setStatus('Auth failed — check your token.', 'error'); _setBusy(false); return; }
      if (!response.ok)            { _setStatus(`Server error ${response.status}.`, 'error'); _setBusy(false); return; }

      const reader  = response.body.getReader();
      const decoder = new TextDecoder();
      let   buffer  = '';

      _setStatus('Transcribing…');

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.trim()) continue;
          try {
            const msg = JSON.parse(line);
            if (msg.type === 'progress') {
              _setProgress(msg.pct);
              _setStatus(`Processing… ${msg.pct}%`);
            } else if (msg.type === 'result') {
              _setProgress(100);
              _showResult(msg.text, msg.language, msg.duration);
              _celebrate();
              _setStatus('Done! 🎉', 'success');
            } else if (msg.type === 'error') {
              _setStatus(`Error: ${msg.detail}`, 'error');
            }
          } catch(_) {}
        }
      }

    } catch(err) {
      _setStatus(`Cannot reach server. Is ngrok running?`, 'error');
    } finally {
      _setBusy(false);
    }
  });

  // ── Copy ───────────────────────────────────────────────────────────────────
  document.getElementById('copy-btn').addEventListener('click', () => {
    const text = document.getElementById('result-text').textContent;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copy-btn');
      btn.textContent = 'Copied ✓';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy ↗'; btn.classList.remove('copied'); }, 2000);
    });
  });

  // ── Helpers ────────────────────────────────────────────────────────────────
  function _setBusy(busy) {
    transcribeBtn.disabled = busy || !selectedFile;
    transcribeBtn.textContent = busy ? 'Transcribing…' : 'Transcribe';
    progressWrap.classList.toggle('visible', busy);
  }

  function _setProgress(pct) {
    document.getElementById('progress-bar-fill').style.width = `${pct}%`;
    document.getElementById('progress-label').textContent = `${pct}%`;
  }

  function _setStatus(msg, type = '') {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = type;
  }

  function _showResult(text, lang, duration) {
    document.getElementById('result-meta').textContent =
      `${lang.toUpperCase()}  ·  ${duration}s  ·  ${text.split(' ').length} words`;
    document.getElementById('result-text').textContent = text;
    document.getElementById('result-wrap').classList.add('visible');
    setTimeout(() => document.getElementById('result-wrap').scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
  }

  // ── Confetti celebration on completion ────────────────────────────────────
  function _celebrate() {
    const colors = ['#ff6b35','#ff2d78','#bd00ff','#00d4ff','#00ffaa','#ffdd00'];
    for (let i = 0; i < 60; i++) {
      setTimeout(() => {
        const el = document.createElement('div');
        el.className = 'confetti';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.top  = '-10px';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.width  = (Math.random() * 8 + 4) + 'px';
        el.style.height = (Math.random() * 8 + 4) + 'px';
        el.style.animationDuration = (Math.random() * 0.8 + 0.8) + 's';
        el.style.animationDelay    = Math.random() * 0.4 + 's';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 2000);
      }, i * 20);
    }

    // Flash ring
    const ring = document.createElement('div');
    ring.className = 'pulse-ring';
    document.body.appendChild(ring);
    setTimeout(() => ring.remove(), 700);
  }
</script>
</body>
</html>
